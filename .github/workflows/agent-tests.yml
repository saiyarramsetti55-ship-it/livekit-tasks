name: CityCare Voice Agent Evaluation & CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    name: Run Unit Tests, Simulations & Latency Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        working-directory: day4
        run: |
          uv sync --dev

      - name: Run Unit Tests (Day 4)
        working-directory: day4
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uv run pytest -v

      - name: Run Latency Evaluation Check (Day 4)
        working-directory: day4
        run: |
          uv run python latency_report.py

      - name: Install Dependencies (Day 5)
        working-directory: day5
        run: |
          uv sync --dev

      - name: Run Unit Tests & Capstone Suite (Day 5)
        working-directory: day5
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uv run pytest -v

      - name: Run Latency Evaluation Check (Day 5)
        working-directory: day5
        run: |
          uv run python latency_report.py

