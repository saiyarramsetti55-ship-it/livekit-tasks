scenarios:
  - label: Normal caller books a check-up
    instructions: |
      PERSONA: You are a normal caller who wants to book a general check-up.

      OPENING LINE:
      "Hi, I want to book a general check-up."

      IMPORTANT:
      - Stay in the conversation until the booking process is completed.
      - Answer the agent's questions one at a time.
      - Do not end the conversation early.
      - Do not provide information before the agent asks for it.
      - When the agent asks for your name, answer: "Sai"
      - When the agent asks for your phone number, answer: "9999999999"
      - When the agent asks for your date of birth, answer: "2000-01-15"
      - After identity verification succeeds, ask:
        "I want an appointment on October 5th 2026 at 9 AM."
      - If the agent asks you to confirm the appointment, answer:
        "Yes, I confirm."
      - After the booking is successfully completed, end the conversation.

    agent_expectations: >
      Collects the caller's name, phone number, and date of birth in order,
      verifies the caller before booking, asks for or confirms the requested
      appointment details, completes the booking process, and does not claim
      that a booking was made without completing the booking process.